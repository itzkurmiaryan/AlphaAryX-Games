<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>AlphaAryX Games</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🎮 AlphaAryX Games</h1>
        <p>Play. Relax. Dominate.</p>
    </header>

    <section class="games">
        <div class="card" onclick="openGame('games/snake/snake.html')">
            🐍 Snake Game
        </div>

        <div class="card" onclick="openGame('games/flappy/flapy.html')">
            🐦 Flappy Bird
        </div>

        <div class="card" onclick="openGame('games/car/car.html')">
            🚗 Car Racing
        </div>

        <div class="card" onclick="openGame('games/tic tac toe/tic.html')">
            ❌⭕ Tic Tac Toe
        </div>

        <div class="card" onclick="openGame('games/memory/memory.html')">
            🧠 Memory Game
        </div>
        <div class="card" onclick="openGame('games/shooter/shooter.html')">
            🧟 Zombie Shooter
        </div>
    </section>

    <script src="script.js"></script>
</body>

</html>
